[package]
name = "l2tunnel-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Explicit copy of the workspace lints with one change: `unsafe_code` is
# `deny` instead of `forbid`, so that exactly one module (`local_pipe::ffi`,
# the named-pipe security boundary of docs/modules/windows-local-service.md,
# WLS-03) can carry a reviewed `#[allow(unsafe_code)]`. Every other module of
# this crate still rejects `unsafe`. Keep the remaining entries identical to
# `[workspace.lints]` in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
l2tunnel-device = { path = "../l2tunnel-device" }
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
tun-rs = { version = "=2.8.18", default-features = false }
tokio = { version = "=1.53.1", features = ["net"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
