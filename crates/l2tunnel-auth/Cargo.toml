[package]
name = "l2tunnel-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
l2tunnel-identity = { path = "../l2tunnel-identity" }
l2tunnel-core = { path = "../l2tunnel-core" }
l2tunnel-device = { path = "../l2tunnel-device" }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
zeroize = "=1.9.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[dev-dependencies]
l2tunnel-udp-control = { path = "../l2tunnel-udp-control" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
