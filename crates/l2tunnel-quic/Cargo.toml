[package]
name = "l2tunnel-quic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
l2tunnel-auth = { path = "../l2tunnel-auth" }
l2tunnel-core = { path = "../l2tunnel-core" }
l2tunnel-device = { path = "../l2tunnel-device" }
bytes = "=1.12.1"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.17", default-features = false, features = ["rustls-ring"] }
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
