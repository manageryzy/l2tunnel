[package]
name = "l2tunnel-raw-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
l2tunnel-device = { path = "../l2tunnel-device" }
l2tunnel-datagram = { path = "../l2tunnel-datagram" }
l2tunnel-auth = { path = "../l2tunnel-auth" }
l2tunnel-core = { path = "../l2tunnel-core" }
ring = "=0.17.14"
zeroize = "=1.9.0"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
l2tunnel-raw-tcp = { path = "../l2tunnel-raw-tcp" }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["test-util", "sync", "net"] }
l2tunnel-runtime = { path = "../l2tunnel-runtime" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
l2tunnel-platform-linux = { path = "../l2tunnel-platform-linux" }
