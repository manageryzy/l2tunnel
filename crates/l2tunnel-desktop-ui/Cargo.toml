[package]
name = "l2tunnel-desktop-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared egui desktop GUI over the local API v5 (docs/modules/desktop-gui.md)"

[lints]
workspace = true

[dependencies]
l2tunnel-client-core = { path = "../l2tunnel-client-core" }
l2tunnel-meters = { path = "../l2tunnel-meters" }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "macros"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
# On Windows enable wgpu (DX12 / DX11 / Vulkan / Microsoft WARP software fallback)
# alongside glow so the GUI always renders even on VMs, RDP, or OpenGL 1.1 hosts.
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu"] }

[dev-dependencies]
# A real canonical configuration for switch tests (same fixture as client-core).
l2tunnel = { path = "../l2tunnel" }
l2tunnel-core = { path = "../l2tunnel-core" }
l2tunnel-swift = { path = "../l2tunnel-swift" }
