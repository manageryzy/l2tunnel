[package]
name = "l2tunnel-https"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
l2tunnel-auth = { path = "../l2tunnel-auth" }
l2tunnel-core = { path = "../l2tunnel-core" }
l2tunnel-device = { path = "../l2tunnel-device" }
bytes = "=1.12.1"
h2 = "=0.4.19"
http = "=1.5.0"
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.53.1", features = ["io-util", "time", "macros"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
zeroize = "=1.9.0"

[dev-dependencies]
h2 = { version = "=0.4.19", features = ["unstable"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "net"] }

[lints]
workspace = true
