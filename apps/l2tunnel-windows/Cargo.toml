[package]
name = "l2tunnel-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
l2tunnel = { path = "../../crates/l2tunnel" }
l2tunnel-auth = { path = "../../crates/l2tunnel-auth" }
l2tunnel-client-core = { path = "../../crates/l2tunnel-client-core" }
l2tunnel-core = { path = "../../crates/l2tunnel-core" }
l2tunnel-device = { path = "../../crates/l2tunnel-device" }
l2tunnel-platform-windows = { path = "../../crates/l2tunnel-platform-windows" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "io-std", "macros", "signal", "time", "sync"] }
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
