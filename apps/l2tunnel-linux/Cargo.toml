[package]
name = "l2tunnel-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Desktop GUI binary (docs/modules/desktop-gui.md). Off by default so the
# headless tunnel build never compiles GUI dependencies.
gui = ["dep:l2tunnel-desktop-ui"]

[[bin]]
name = "l2tunnel-linux"
path = "src/main.rs"

[[bin]]
name = "l2tunnel-linux-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
l2tunnel-client-core = { path = "../../crates/l2tunnel-client-core" }
l2tunnel-desktop-ui = { path = "../../crates/l2tunnel-desktop-ui", optional = true }
