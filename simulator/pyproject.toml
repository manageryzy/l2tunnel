[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2tunnel-simulator"
version = "0.3.0"
description = "Reproducible Monte Carlo experiments for tunnel design"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "plotly>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "lz4>=4,<5"]
quic = ["aioquic==1.3.0"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
l2tunnel-sim = "l2tunnel_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l2tunnel_sim = ["_vendor/kcp/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
