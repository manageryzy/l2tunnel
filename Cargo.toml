[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["third_party/smoltcp"]

[patch.crates-io]
smoltcp = { path = "third_party/smoltcp" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
